name: Hlidac bytu

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  run-hlidac:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Debug workspace
      run: |
        echo "=== WORKSPACE ==="
        pwd
        ls -R .

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install cloudscraper beautifulsoup4

    - name: Run script
      run: |
        cd $GITHUB_WORKSPACE/hlidac-bytu-clean
        echo "=== RUNNING IN ==="
        pwd
        ls -R .
        python3 hlidac.py
