name: Hlidac bytu

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run-hlidac:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Show workspace structure
      run: |
        echo "Workspace:"
        pwd
        ls -R .

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install cloudscraper beautifulsoup4

    - name: Run script
      run: |
        cd $GITHUB_WORKSPACE
        echo "Now in:"
        pwd
        ls -R .
        python3 hlidac.py
